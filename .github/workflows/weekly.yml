name: Weekly digest

on:
  schedule:
    - cron: "0 7 * * 5"          # Fridays at 07:00: the new digest
      timezone: "Europe/London"
    - cron: "0 13 * * 5,6"       # Fridays and Saturdays at 13:00: more Spotify lookups and the playlists
      timezone: "Europe/London"
  workflow_dispatch:              # "Run workflow" button for running it by hand
    inputs:
      rebuild_only:
        description: "Only rebuild the page (no new digest or playlist)"
        type: boolean
        default: false
      playlists_only:
        description: "Only do Spotify (look up more releases and make the playlists)"
        type: boolean
        default: false

permissions:
  contents: write                 # commit the updated data/ and docs/ folders
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build digest
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          VOTE_KEY: ${{ secrets.VOTE_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ "${{ inputs.rebuild_only }}" = "true" ]; then
            python -m digest.main --rebuild
          elif [ "${{ inputs.playlists_only }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 13 * * 5,6" ]; then
            python -m digest.main --playlists
          else
            python -m digest.main
          fi

      - name: Save state and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Digest for $(date +%G-W%V)"
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
