name: Weekly digest

on:
  schedule:
    - cron: "0 7 * * 5"          # Fridays at 07:00
      timezone: "Europe/London"
  workflow_dispatch:              # "Run workflow" button for running it by hand

permissions:
  contents: write                 # commit the updated data/ and docs/ folders
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build digest
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          VOTE_KEY: ${{ secrets.VOTE_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: python -m digest.main

      - name: Save state and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Digest for $(date +%G-W%V)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
