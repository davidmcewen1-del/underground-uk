# Settings for the weekly Underground UK digest.
# Edit this file on GitHub (pencil icon) to change how the digest behaves.

[digest]
title = "Underground UK"
size = 500                    # releases per weekly digest
random_share = 0.2            # share of each digest picked at random, ignoring your votes
max_per_label = 4             # stops one busy label filling the page
include_self_released = true  # artists releasing without a label
include_preorders = false     # only music that is already out
first_run_lookback_days = 7   # how far back the very first digest looks

[labels]
exclude_majors = true         # Universal, Sony, Warner and the labels they own
# Size limits, using Discogs data. 0 = switched off.
max_releases = 0              # exclude labels with more releases than this on Discogs
max_avg_have = 0              # exclude labels whose releases average more Discogs "haves" than this
max_bandcamp_checks_per_run = 400
max_discogs_checks_per_run = 200
# Labels you've found elsewhere (radio, shops, friends): checked every week, and their
# new releases always make the digest. Paste Bandcamp or Discogs label addresses, e.g.
# follow = [
#   "https://youngechorecords.bandcamp.com",
#   "https://www.discogs.com/label/12345-Some-Label",
# ]
follow = []
always_exclude = []           # label names to always skip, e.g. ["Some Label"]
never_exclude = []            # label names never to treat as major

[bandcamp]
delay_seconds = 2.0           # pause between requests to Bandcamp
pages_per_city = 8            # 60 releases per page
