# Settings for the weekly Underground UK digest.
# Edit this file on GitHub (pencil icon) to change how the digest behaves.

[digest]
title = "Underground UK"
size = 200                    # releases per weekly digest
random_share = 0.2            # share of each digest picked at random, ignoring your votes
max_per_label = 4             # stops one busy label filling the page
include_self_released = true  # artists releasing without a label
include_preorders = false     # only music that is already out
first_run_lookback_days = 7   # how far back the very first digest looks

[labels]
exclude_majors = true         # Universal, Sony, Warner and the labels they own
# Size limits, using Discogs data. 0 = switched off.
max_releases = 0              # exclude labels with more releases than this on Discogs
max_avg_have = 0              # exclude labels whose releases average more Discogs "haves" than this
max_bandcamp_checks_per_run = 150
max_discogs_checks_per_run = 100
always_exclude = []           # label names to always skip, e.g. ["Some Label"]
never_exclude = []            # label names never to treat as major

[bandcamp]
delay_seconds = 2.0           # pause between requests to Bandcamp
pages_per_city = 5            # 60 releases per page
cities = [
  { name = "London",     geoname_id = 2643743 },
  { name = "Bristol",    geoname_id = 2654675 },
  { name = "Leeds",      geoname_id = 2644688 },
  { name = "Manchester", geoname_id = 2643123 },
  { name = "Glasgow",    geoname_id = 2648579 },
  { name = "Edinburgh",  geoname_id = 2650225 },
  { name = "Sheffield",  geoname_id = 2638077 },
  { name = "Liverpool",  geoname_id = 2644210 },
  { name = "Birmingham", geoname_id = 2655603 },
  { name = "Brighton",   geoname_id = 2654710 },
  { name = "Nottingham", geoname_id = 2641170 },
  { name = "Cardiff",    geoname_id = 2653822 },
  { name = "Belfast",    geoname_id = 2655984 },
]

[discogs]
delay_seconds = 1.1           # Discogs allows 60 requests a minute
search_pages = 5              # 100 results per page
max_release_lookups = 250
skip_formats = ["Reissue", "Repress", "Remastered", "Unofficial Release"]

[spotify]
enabled = true
tracks_per_release = 1        # 0 = add whole releases
public = false
playlist_name = "Underground UK – {week}"

[votes]
# Your Cloudflare Worker address, filled in during setup (SETUP.md step 4).
worker_url = ""
