[discogs]
delay_seconds = 1.1           # Discogs allows 60 requests a minute
search_pages = 10             # 100 results per page
max_release_lookups = 600
skip_formats = ["Reissue", "Repress", "Remastered", "Unofficial Release"]

[spotify]
enabled = true
tracks_per_release = 1        # 0 = add whole releases
public = false
liked_playlist_name = "Underground UK – Liked"   # every 👍 release, kept up to date each week
playlist_name = "Underground UK – {kind} – {week}"   # two a week: Labels and Self-released

[votes]
# Your Cloudflare Worker address, filled in during setup (SETUP.md step 4).
worker_url = ""
