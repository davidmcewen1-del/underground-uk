<meta charset="utf-8">
<title>Primordial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed microscope slide (canvas) with instrument-style overlays: readout top, goals left, tools bottom, specimen / evolve panels right (bottom sheet on phones) */
:root {
  --bg: #050c0d;
  --glass: rgba(10, 24, 26, 0.84);
  --line: rgba(140, 210, 200, 0.18);
  --fg: #d7ebe6;
  --muted: #7f9e98;
  --accent: #7fe0c8;
  --warn: #ff7a8a;
  --gold: #e8c46a;
  --heat: #ff9a4a;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#app { position: relative; height: 100%; overflow: hidden; }
canvas#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.label { font-family: var(--display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

/* readout */
#readout { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; pointer-events: none; }
#readout > * { pointer-events: auto; }
#readout .brand { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 0.06em; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; }
#readout .brand small { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--accent); letter-spacing: 0; }
.stat { padding: 6px 10px; min-width: 70px; }
.stat b { display: block; font-family: var(--mono); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
#dnaBtn { cursor: pointer; text-align: left; color: var(--fg); font: inherit; border-color: rgba(232, 196, 106, 0.5); position: relative; }
#dnaBtn b { color: var(--gold); }
#dnaBtn .label { color: var(--gold); }
#dnaBtn.ready::after { content: ""; position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.sharebox { padding: 6px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 150px; flex: 0 1 200px; }
.share { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.share span { display: block; height: 100%; transition: width .4s; }
.sharebox .row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sharebox .row b { color: var(--accent); font-weight: 500; }
#chart { width: 150px; height: 44px; display: block; }
.chartbox { padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.legend { display: flex; gap: 10px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 2px; vertical-align: middle; margin-right: 4px; }

/* event banner */
#banner { position: absolute; left: 50%; transform: translateX(-50%); top: 84px; padding: 8px 14px; display: flex; flex-direction: column; gap: 5px; min-width: 240px; max-width: calc(100% - 32px); border-color: var(--heat); text-align: center; pointer-events: none; }
#banner b { font-family: var(--display); font-size: 15px; color: var(--heat); letter-spacing: 0.04em; }
#banner span { font-size: 12.5px; color: var(--fg); }
#banner .t { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
#banner .t i { display: block; height: 100%; background: var(--heat); }

/* goals */
#goals { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 92px; width: 250px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
#goals h2 { margin: 0; font-family: var(--display); font-size: 15px; font-weight: 600; }
.goal { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 12.5px; }
.goal .bar { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.goal .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.goal.done .bar i { background: var(--gold); }
.goal span:last-of-type { font-family: var(--mono); font-size: 11px; color: var(--muted); }
#goals button.link { background: none; border: 0; padding: 0; color: var(--accent); font: 12px var(--body); text-align: left; cursor: pointer; }

/* toolbar */
#toolbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 5px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px); }
.btn { font-family: var(--display); font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; min-height: 38px; }
.btn:hover { background: rgba(127, 224, 200, 0.08); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(127, 224, 200, 0.1); }
.btn.danger[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); background: rgba(255, 122, 138, 0.1); }
.btn:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.sep { width: 1px; background: var(--line); margin: 4px 2px; }

/* side panels */
.side { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 92px; width: 300px; padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 170px); overflow-y: auto; }
.side header { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.side h3 { margin: 0; font-family: var(--display); font-size: 17px; font-weight: 600; }
.side .sub { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.close { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; }
.traits { display: grid; grid-template-columns: 74px 1fr 44px; gap: 5px 8px; align-items: center; font-size: 12px; }
.traits .t { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.traits .t i { display: block; height: 100%; background: var(--accent); }
.traits span:nth-child(3n) { font-family: var(--mono); font-size: 11px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
#brain { width: 100%; height: 170px; display: block; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions .btn { border-color: var(--line); flex: 1 1 auto; justify-content: center; }
.actions .btn.danger { color: var(--warn); border-color: rgba(255, 122, 138, 0.4); }
.actions .btn.go { color: var(--accent); border-color: rgba(127, 224, 200, 0.5); }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }
.upg { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left; width: 100%; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--fg); cursor: pointer; font: inherit; }
.upg:hover:not(:disabled) { border-color: var(--gold); }
.upg:disabled { cursor: default; opacity: 0.5; }
.upg b { font-family: var(--display); font-weight: 600; font-size: 14px; }
.upg small { grid-column: 1; font-size: 12px; color: var(--muted); }
.upg .cost { grid-row: 1 / span 2; grid-column: 2; font-family: var(--mono); font-size: 13px; color: var(--gold); text-align: right; display: flex; flex-direction: column; align-items: end; gap: 4px; }
.pips { display: flex; gap: 3px; }
.pips i { width: 10px; height: 4px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--gold); }
.rivals { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.rivals div { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11.5px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* toasts and modal */
#toasts { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.toast { padding: 8px 14px; font-size: 13px; text-align: center; animation: rise .3s ease-out; }
.toast.big { border-color: var(--gold); color: var(--gold); font-family: var(--display); font-size: 15px; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
#modal { position: absolute; inset: 0; background: rgba(2, 6, 7, 0.72); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#modal > .panel { max-width: 560px; width: 100%; max-height: 88%; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
#modal h2 { margin: 0; font-family: var(--display); font-size: 22px; text-wrap: balance; }
#modal p { margin: 0; line-height: 1.55; font-size: 14px; max-width: 62ch; }
.howto { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; line-height: 1.45; }
.howto li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; }
.howto li b { font-family: var(--display); font-weight: 600; color: var(--accent); font-size: 13px; letter-spacing: 0.04em; }
.ages { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.ages li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.ages li b { font-family: var(--display); font-weight: 600; font-size: 14px; display: block; }
.ages li .n { font-family: var(--mono); color: var(--muted); }
.ages li.now .n, .ages li.now b { color: var(--accent); }
.ages li.locked { opacity: 0.6; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.statgrid div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.statgrid b { display: block; font-family: var(--mono); font-size: 18px; font-weight: 500; }
.mbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.mbtns .btn { flex: 1 1 auto; justify-content: center; border-color: var(--line); }
.primary { background: var(--accent); color: #04201b; border: 0; font-weight: 600; }
.primary:hover { background: #a3eedb; }

@media (max-width: 760px) {
  #readout { gap: 6px; }
  #readout .brand, .chartbox, #sTimeBox, #sZoneBox { display: none; }
  .stat { min-width: 0; padding: 5px 8px; }
  .stat b { font-size: 14px; }
  .sharebox { flex: 1 1 120px; min-width: 0; }
  #banner { top: 70px; }
  #goals { top: auto; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); width: auto; right: max(12px, env(safe-area-inset-right, 0px)); }
  #goals.min .goal, #goals.min .link { display: none; }
  .side { top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); max-height: 60%; }
  #brain { height: 140px; }
  .btn { padding: 6px 7px; font-size: 12px; min-height: 36px; }
  #toolbar { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); transform: none; max-width: none; flex-wrap: nowrap; justify-content: space-between; gap: 2px; padding: 4px; }
  #toolbar .sep { display: none; }
  #toasts { bottom: auto; top: calc(205px + env(safe-area-inset-top, 0px)); }
  .howto li { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .goal .bar i, .share span { transition: none; } #dnaBtn.ready::after { animation: none; } }

/* missions and abilities */
#mission { position: absolute; left: 50%; transform: translateX(-50%); top: 84px; padding: 8px 14px; display: flex; flex-direction: column; gap: 4px; width: min(380px, calc(100% - 32px)); border-color: var(--gold); text-align: center; pointer-events: none; }
#mission.below { top: 150px; }
#mission b { font-family: var(--display); font-size: 15px; color: var(--gold); letter-spacing: 0.04em; }
#mission span:not(.label) { font-size: 12.5px; }
#mission .label { color: var(--gold); }
#mission .t { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
#mission .t i { display: block; height: 100%; background: var(--gold); }
#abilities { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
.ab { width: 68px; height: 68px; border-radius: 50%; border: 1.5px solid var(--gold); background: var(--glass); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); touch-action: manipulation; }
.ab b { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--gold); }
.ab small { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.ab:disabled { border-color: var(--line); cursor: default; }
.ab:disabled b { color: var(--muted); }
.ab:not(:disabled):active { transform: scale(0.94); }
@media (max-width: 1100px) and (min-width: 761px) { #abilities { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 760px) {
  #mission { top: 70px; }
  #mission.below { top: 136px; }
  #abilities { flex-direction: column; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
  .ab { width: 60px; height: 60px; }
}
/* open world */
.history { max-height: calc(100% - 190px); overflow-y: auto; }
.history h2 { margin: 0; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.4; }
.log li { display: flex; flex-direction: column; gap: 1px; padding: 6px 0 0; border-top: 1px solid var(--line); }
.log li span { font-family: var(--mono); font-size: 10.5px; color: var(--accent); }
.log li.go { cursor: pointer; }
.log li.go:hover { color: var(--gold); }
.splist { display: flex; flex-direction: column; gap: 4px; }
.sprow { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.sprow:hover { border-color: var(--accent); }
.sprow.fav { border-color: var(--gold); }
.sprow b { font-family: var(--display); font-weight: 600; font-size: 13.5px; display: block; }
.sprow small { font-size: 11px; color: var(--muted); }
.sprow .n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.star { background: none; border: 0; color: var(--gold); font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 4px; }
@media (max-width: 760px) {
  .wtools { overflow-x: auto; justify-content: flex-start !important; }
  .wtools .btn { flex: 0 0 auto; }
  #goals.min .note, #goals.min .log, #goals.min .label:nth-of-type(2) { display: none; }
  .history { max-height: 50%; }
}
/* shared by later ages */
.ages li.past .n, .ages li.past b { color: var(--gold); }
.upg em { font-style: normal; color: var(--fg); opacity: 0.75; }
#preview { width: 100%; height: 150px; display: block; border: 1px solid var(--line); border-radius: 8px; background: rgba(4, 16, 22, 0.6); }
.mouths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mouths button { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 7px 6px; font: 12px var(--body); cursor: pointer; display: flex; flex-direction: column; gap: 2px; text-align: left; }
.mouths button b { font-family: var(--display); font-size: 13px; font-weight: 600; }
.mouths button small { color: var(--muted); font-size: 11px; line-height: 1.3; }
.mouths button[aria-pressed="true"] { border-color: var(--gold); }
.mouths button[aria-pressed="true"] b { color: var(--gold); }
.zone { font-family: var(--mono); }
</style>

<div id="app">
  <canvas id="world" aria-label="Game world"></canvas>
  <div id="hud"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <span class="label" id="mEyebrow"></span>
      <h2 id="mTitle"></h2>
      <div id="mBody" style="display:flex;flex-direction:column;gap:12px"></div>
      <div class="mbtns" id="mBtns"></div>
    </div>
  </div>
</div>

<script src="shared.js" charset="utf-8"></script>
<script src="world.js" charset="utf-8"></script>
<script>
(() => {
  const saved = PR.load();
  if (!saved || saved.age !== 'world' || !saved.state) { PR.startAge('world'); return; }
  PR.startAge('world', saved.state);
  PR.showModal({
    eyebrow: 'Saved world', title: 'Welcome back',
    body: '<p>Your world has kept evolving where you left it.</p>',
    buttons: [
      ['New world', () => PR.showModal({
        eyebrow: 'New world', title: 'Start a new world?',
        body: '<p>This world and every species in it will be lost.</p>',
        buttons: [['Start over', () => { PR.clearSave(); PR.startAge('world'); }], ['Keep my world', null, true]],
      })],
      ['Continue', null, true],
    ],
  });
})();
</script>
